name: CI Pipeline

# 1. TRIGGERS: When does this workflow run?
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 2. JOBS: What environment should GitHub provision?
jobs:
  test:
    name: Run Pytest & Contract Checks
    runs-on: ubuntu-latest            # An ephemeral Linux cloud VM

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4     # Clones your git repository onto the runner

      # 3. CRITICAL DE REQUIREMENT: PySpark runs on top of the JVM!
      # Without Java, PySpark crashes immediately when creating a SparkSession.
      - name: ☕ Set up Java (Required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. PYTHON & DEPENDENCY CACHING:
      # cache: 'pip' saves installed packages so subsequent runs take seconds instead of minutes.
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. SYNTAX GATE: Compiles all Python files to detect syntax errors before tests run
      - name: 🔍 Syntax & Quality Check
        run: |
          python -m py_compile $(find src/ streamlit/ tests/ -name "*.py")

      # 6. TEST EXECUTION: Pytest uses our pytest.ini and executes all 52 tests!
      - name: 🧪 Run Automated Test Suite (Pytest)
        run: |
          pytest -v
