sonar.projectKey=luc-dt_spotify-pipeline
sonar.organization=luc-dt

# Scan only project-owned application code and SQL
sonar.sources=src,streamlit,airflow/dags,airflow/scripts,scripts,sql
sonar.tests=tests
sonar.python.version=3.10

sonar.exclusions=\
  data/**,\
  state/**,\
  .github/**,\
  Dockerfile,\
  airflow/Dockerfile,\
  docker-compose.yml,\
  airflow/docker-compose.yaml,\
  .venv/**,\
  venv/**,\
  ENV/**,\
  .pytest_cache/**,\
  .ipynb_checkpoints/**,\
  __pycache__/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.pyo,\
  **/*.pyd,\
  **/*.parquet,\
  **/*.crc,\
  **/_SUCCESS,\
  airflow/logs/**,\
  airflow/config/**,\
  .agents/**,\
  .claude/**,\
  .vscode/**,\
  .env,\
  **/.env,\
  *.env,\
  scratch/**,\
  tests/**

sonar.coverage.exclusions=tests/**,scripts/**,streamlit/**,airflow/**

# Security suppressions:
sonar.issue.ignore.multicriteria=r1,r2,r3,r4,r5,r6,r7,r8,r9,r10,r11,r12,r13
sonar.issue.ignore.multicriteria.r1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.r1.resourceKey=**
sonar.issue.ignore.multicriteria.r2.ruleKey=python:S7608
sonar.issue.ignore.multicriteria.r2.resourceKey=**
