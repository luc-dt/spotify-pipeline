sonar.projectKey=luc-dt_spotify-pipeline
sonar.organization=luc-dt

# Exclude raw cache and build artifacts
sonar.exclusions=data/**,airflow/logs/**,.venv/**,scratch/**

# Security suppressions - scoped, each with a runtime justification:
#   r1 pythonsecurity:S8707: CLI argparse paths are validated at runtime via
#      _safe_resolve_path() (Path.resolve() + is_relative_to()) before any file op.
#   r2 python:S7608: S3 ExpectedBucketOwner is conditionally applied when the
#      AWS_ACCOUNT_ID env var is set (scripts/audit_medallion_layers.py).
#   r3 docker:S8541 in airflow/Dockerfile only: PySpark (=3.4.1) is published as
#      sdist only, making --only-binary :all: impossible here. Deps are pinned exactly.
#   r4 githubactions:S8541 in ci.yml only: same PySpark sdist constraint for the
#      pytest job. requirements.txt is pinned exactly.
# Note: docker:S8544 / githubactions:S8544 are RESOLVED in code (exact version pins)
#   across requirements.txt, requirements-app.txt, and both Dockerfiles - no suppression.
sonar.issue.ignore.multicriteria=r1,r2,r3,r4
sonar.issue.ignore.multicriteria.r1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.r1.resourceKey=**
sonar.issue.ignore.multicriteria.r2.ruleKey=python:S7608
sonar.issue.ignore.multicriteria.r2.resourceKey=**
sonar.issue.ignore.multicriteria.r3.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.r3.resourceKey=airflow/Dockerfile
sonar.issue.ignore.multicriteria.r4.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.r4.resourceKey=.github/workflows/ci.yml
