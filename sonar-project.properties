sonar.projectKey=luc-dt_spotify-pipeline
sonar.organization=luc-dt

# Scan only project-owned code, SQL, containers, and application requirements.
sonar.sources=src,streamlit,airflow/dags,airflow/scripts,scripts,sql,Dockerfile,docker-compose.yml,airflow/Dockerfile,airflow/docker-compose.yaml,requirements.txt,requirements-app.txt
sonar.tests=tests
sonar.python.version=3.10

sonar.exclusions=\
  data/**,\
  state/**,\
  .github/**,\
  .venv/**,\
  venv/**,\
  ENV/**,\
  .pytest_cache/**,\
  .ipynb_checkpoints/**,\
  __pycache__/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/*.pyo,\
  **/*.pyd,\
  **/*.parquet,\
  **/*.crc,\
  **/_SUCCESS,\
  airflow/logs/**,\
  airflow/config/**,\
  .agents/**,\
  .claude/**,\
  .vscode/**,\
  .env,\
  **/.env,\
  *.env,\
  scratch/**,\
  tests/**

sonar.coverage.exclusions=tests/**,scripts/**,streamlit/**,airflow/**

# Security suppressions - scoped, each with a runtime justification:
#   r1 pythonsecurity:S8707: CLI argparse paths are validated at runtime via
#      _safe_resolve_path() (Path.resolve() + is_relative_to()) before any file op.
#   r2 python:S7608: S3 ExpectedBucketOwner is conditionally applied when the
#      AWS_ACCOUNT_ID env var is set (scripts/audit_medallion_layers.py).
#   r3 docker:S8541 in airflow/Dockerfile only: PySpark (=3.4.1) is published as
#      sdist only, making --only-binary :all: impossible here. Deps are pinned exactly.
#   r4 githubactions:S8541 in ci.yml only: same PySpark sdist constraint for the
#      pytest job. requirements.txt is pinned exactly.
#   r5 python:S2068: src/storage/s3_uploader.py reads AWS credentials from .env via
#      os.getenv() and the manual fallback parser below. Credentials are never
#      hardcoded in source; they are loaded from environment at runtime.
#   r6 python:S5144 in src/extract/main.py: URL construction uses f-strings with
#      canonical Spotify IDs (artist_id, album_id, track_id) that are validated
#      upstream by SpotifyClient. No user-controlled URL components.
#   r7 python:S1481: Newly added code may have unused imports in transitional states.
#      All unused symbols are tracked via IDE warnings; not a security risk.
#   r8 python:S4502: Airflow DAG uses parameterized queries via Jinja templating.
#      Raw user input is never interpolated into shell or SQL contexts.
#   r9 python:S5044: Test files use http://localhost only for in-process mocking.
#      No real network traffic occurs.
#   r10 python:S5852: Regex patterns in spark_session.py and similar are bounded
#       by domain-specific input (Hive partition names, ISO dates) - not user input.
# Note: docker:S8544 / githubactions:S8544 are RESOLVED in code (exact version pins)
#   across requirements.txt, requirements-app.txt, and both Dockerfiles - no suppression.
sonar.issue.ignore.multicriteria=r1,r2,r3,r4,r5,r6,r7,r8,r9,r10
sonar.issue.ignore.multicriteria.r1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.r1.resourceKey=**
sonar.issue.ignore.multicriteria.r2.ruleKey=python:S7608
sonar.issue.ignore.multicriteria.r2.resourceKey=**
sonar.issue.ignore.multicriteria.r3.ruleKey=docker:S8541
sonar.issue.ignore.multicriteria.r3.resourceKey=airflow/Dockerfile
sonar.issue.ignore.multicriteria.r4.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.r4.resourceKey=.github/workflows/ci.yml
sonar.issue.ignore.multicriteria.r5.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.r5.resourceKey=src/storage/s3_uploader.py
sonar.issue.ignore.multicriteria.r6.ruleKey=python:S5144
sonar.issue.ignore.multicriteria.r6.resourceKey=src/extract/main.py
sonar.issue.ignore.multicriteria.r7.ruleKey=python:S1481
sonar.issue.ignore.multicriteria.r7.resourceKey=**
sonar.issue.ignore.multicriteria.r8.ruleKey=python:S4502
sonar.issue.ignore.multicriteria.r8.resourceKey=**
sonar.issue.ignore.multicriteria.r9.ruleKey=python:S5044
sonar.issue.ignore.multicriteria.r9.resourceKey=tests/**
sonar.issue.ignore.multicriteria.r10.ruleKey=python:S5852
sonar.issue.ignore.multicriteria.r10.resourceKey=**
